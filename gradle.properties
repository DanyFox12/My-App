# JVM args for the Gradle daemon. Generous heap keeps multi-module builds fast
# without pushing CI/low-RAM dev machines over the edge.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build performance: parallel module compilation, caching, and on-demand config.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required for all modern Jetpack libraries.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resources actually referenced (smaller APK, faster builds).
android.nonTransitiveRClass=true

# R8 full mode for release shrinking (smaller, faster APK on low-end devices).
android.enableR8.fullMode=true
